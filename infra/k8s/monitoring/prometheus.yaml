apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: green-cloud
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Scrape Mumbai worker
      - job_name: 'worker-mumbai'
        static_configs:
          - targets: ['worker-mumbai:9090']
            labels:
              region: 'mumbai'

      # Scrape Mumbai admission controller
      - job_name: 'admission-controller'
        static_configs:
          - targets: ['admission-controller:9090']
            labels:
              region: 'mumbai'

      # Scrape Montreal worker via external IP
      - job_name: 'worker-montreal'
        static_configs:
          - targets: ['MONTREAL_WORKER_IP:9090']
            labels:
              region: 'montreal'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: green-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: green-cloud-sa
      containers:
      - name: prometheus
        image: prom/prometheus:v2.51.0
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.retention.time=24h"
          - "--storage.tsdb.path=/prometheus"
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: storage
          mountPath: /prometheus
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "200m"
            memory: "512Mi"
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: green-cloud
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
