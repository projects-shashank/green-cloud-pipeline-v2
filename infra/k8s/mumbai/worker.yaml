apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-mumbai
  namespace: green-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-mumbai
  template:
    metadata:
      labels:
        app: worker-mumbai
    spec:
      serviceAccountName: green-cloud-sa
      containers:
      - name: worker
        image: asia-south1-docker.pkg.dev/green-cloud-pipeline-v2/green-cloud-pipeline/worker:latest
        env:
        - name: PROJECT_ID
          value: "green-cloud-pipeline-v2"
        - name: REGION
          value: "mumbai"
        - name: SUBSCRIPTION_ID
          value: "mumbai-process-sub"
        - name: CARBON_FORECASTER_URL
          value: "http://carbon-forecaster:8080/carbon"
        - name: GCS_BUCKET
          value: "green-cloud-pipeline-v2-data-lake"
        - name: REDIS_HOST
          value: "redis"
        - name: SLA_THRESHOLD_MS
          value: "2000"
        resources:
          requests:
            cpu: "400m"
            memory: "512Mi"
          limits:
            cpu: "800m"
            memory: "1Gi"
